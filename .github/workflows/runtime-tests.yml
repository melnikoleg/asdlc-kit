name: Runtime tests

on:
  push:
    branches: [main, feat/codex-code-mode-default]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests (no Codex or Claude authentication required)
        run: python -m pytest runtime/tests -o asyncio_mode=auto
